name = "crea-url"
main = "deploy/cloudflare-worker.ts"
compatibility_date = "2024-09-23"
keep_vars = true

# Frontend estático (dist/)
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Cloudflare D1 (metadatos de páginas)
[[d1_databases]]
binding = "DB"
database_name = "crea_url_db"
database_id = "cbc19ef1-6752-48cd-ac14-c2f986651193"

# Variables de Supabase Storage (mejor como secrets en producción)
# wrangler secret put SUPABASE_URL
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY
[vars]
SUPABASE_STORAGE_BUCKET = "html-pages"

# Limpieza de páginas caducadas: cada hora
[triggers]
crons = ["0 * * * *"]
